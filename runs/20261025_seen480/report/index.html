<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seen-480 Stage Diagnosis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: an overview of summary cards (pipeline, failure modes, task x mode), then one task at a time;
   each rollout is a card that reads left to right in time: timeline -> per-stage clips -> diagnosis. */
:root {
  --page: #f2f2ee; --surface: #fcfcfb; --surface-2: #f5f5f1; --ink: #0b0b0b; --ink-2: #52514e; --muted: #77756f;
  --hair: rgba(11,11,11,.10); --grid: #e1e0d9; --axis: #c3c2b7;
  --accent: #0b0b0b; --accent-ink: #fcfcfb;
  --good: #0ca30c; --good-ink: #006300; --bad: #d03b3b; --bad-ink: #b02f2f; --bad-wash: rgba(208,59,59,.14);
  --m-fixture_actuation: #2a78d6; --m-grasp_acquisition: #eb6834; --m-placement: #1baf7a; --m-grasp_retention: #eda100;
  --m-task_level: #e87ba4; --m-stage_not_terminated: #008300; --m-process_skill: #6250d6; --m-disturbance: #e34948;
  --m-criterion_or_sim: #898781; --heat: 42,120,214;
  --st0: #d9d8d0; --st1: #b9b8b0; --st2: #8f8e87; --st3: #63625d;
  --st0-ink: #0b0b0b; --st1-ink: #0b0b0b; --st2-ink: #ffffff; --st3-ink: #ffffff;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 6px 20px rgba(11,11,11,.05);
  --f-display: "Schibsted Grotesk", "Instrument Sans", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Instrument Sans", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, "Noto Sans TC", monospace;
  --r: 14px; --r-s: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #918f88;
    --hair: rgba(255,255,255,.10); --grid: #2c2c2a; --axis: #383835; --accent: #f0efec; --accent-ink: #1a1a19;
    --good-ink: #2fc22f; --bad-ink: #ef7a7a; --bad-wash: rgba(230,103,103,.16);
    --m-fixture_actuation: #3987e5; --m-grasp_acquisition: #d95926; --m-placement: #199e70; --m-grasp_retention: #c98500;
    --m-task_level: #d55181; --m-stage_not_terminated: #008300; --m-process_skill: #9085e9; --m-disturbance: #e66767;
    --heat: 57,135,229;
    --st0: #3a3a37; --st1: #55554f; --st2: #7c7b74; --st3: #a9a89f;
    --st0-ink: #f0efec; --st1-ink: #f0efec; --st2-ink: #0b0b0b; --st3-ink: #0b0b0b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #918f88;
  --hair: rgba(255,255,255,.10); --grid: #2c2c2a; --axis: #383835; --accent: #f0efec; --accent-ink: #1a1a19;
  --good-ink: #2fc22f; --bad-ink: #ef7a7a; --bad-wash: rgba(230,103,103,.16);
  --m-fixture_actuation: #3987e5; --m-grasp_acquisition: #d95926; --m-placement: #199e70; --m-grasp_retention: #c98500;
  --m-task_level: #d55181; --m-stage_not_terminated: #008300; --m-process_skill: #9085e9; --m-disturbance: #e66767;
  --heat: 57,135,229;
  --st0: #3a3a37; --st1: #55554f; --st2: #7c7b74; --st3: #a9a89f;
  --st0-ink: #f0efec; --st1-ink: #f0efec; --st2-ink: #0b0b0b; --st3-ink: #0b0b0b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--hair); }
.bar .wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; margin-right: auto; min-width: 0; }
.brand b { font: 700 17px var(--f-display); letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--hair); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--hair); border-radius: 999px; padding: 5px 10px; max-width: 100%; }
.navlink { font-size: 13px; text-decoration: none; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--hair); background: var(--surface-2); }
.navlink[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* generic cards */
main { padding-block: 22px 60px; display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.card > h2 { font-size: 19px; margin-bottom: 4px; }
.sub { color: var(--ink-2); font-size: 14px; margin: 0 0 14px; max-width: 75ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 18px; }

/* hero */
.hero { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: end; }
.hero h1 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.12; margin: 6px 0 10px; }
.hero p { margin: 0; color: var(--ink-2); max-width: 66ch; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-s); padding: 12px 14px; }
.kpi .v { font: 700 26px/1.1 var(--f-display); }
.kpi .v small { font: 500 14px var(--f-body); color: var(--muted); margin-left: 4px; }
.kpi .l { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.pstep { position: relative; background: var(--surface-2); border: 1px solid var(--hair); border-radius: var(--r-s); padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pstep:not(:last-child)::after { content: ""; position: absolute; right: -10px; top: 28px; width: 8px; height: 8px; border-top: 1.5px solid var(--muted); border-right: 1.5px solid var(--muted); transform: rotate(45deg); }
.pstep .n { font: 500 12px var(--f-mono); color: var(--muted); }
.pstep h3 { font-size: 15px; }
.pstep p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.pstep .out { margin-top: auto; font-size: 12.5px; padding-top: 6px; border-top: 1px dashed var(--hair); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--hair); background: var(--surface); width: fit-content; }
.tag.prog { border-color: var(--ink-2); }
.tag.vid { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pipe-q { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 10px; font-size: 13px; }
.pipe-q div { border-top: 2px solid var(--ink); padding-top: 6px; color: var(--ink-2); }
.pipe-q b { color: var(--ink); }
@media (max-width: 1000px) {
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pstep::after { display: none; }
  .pipe-q { display: none; }
}
@media (max-width: 520px) { .pipe { grid-template-columns: 1fr; } }

/* failure-mode bars */
.mbars { display: grid; gap: 12px; }
.mbar { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.mbar .name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.mbar .track { position: relative; height: 18px; }
.mbar .fill { height: 18px; border-radius: 0 4px 4px 0; min-width: 3px; }
.mbar .val { position: absolute; top: 0; font: 500 12.5px/18px var(--f-mono); color: var(--ink-2); padding-left: 8px; white-space: nowrap; }
.mbar .desc { grid-column: 2; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
@media (max-width: 560px) { .mbar { grid-template-columns: 1fr; } .mbar .desc { grid-column: 1; } }

/* heatmap table */
.tablewrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.heat { border-collapse: separate; border-spacing: 2px; width: 100%; font-size: 13px; }
.heat th { font-weight: 600; color: var(--ink-2); text-align: center; padding: 4px; vertical-align: bottom; font-size: 12px; line-height: 1.2; }
.heat th.tl { text-align: left; }
.heat td { text-align: center; height: 30px; min-width: 44px; border-radius: 4px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.heat td.task { text-align: left; font-family: var(--f-body); font-weight: 600; white-space: nowrap; padding-right: 10px; min-width: 0; }
.heat td.task a { text-decoration: none; }
.heat td.task a:hover { text-decoration: underline; }
.heat td.succ { min-width: 120px; text-align: left; }
.minibar { display: flex; align-items: center; gap: 8px; }
.minibar i { display: block; height: 8px; border-radius: 0 3px 3px 0; background: var(--good); }
.minibar span { font-size: 12.5px; color: var(--ink-2); }
.heat tr.row:hover td.task { text-decoration: underline; }
.heat td.cnt { cursor: pointer; }

/* mechanisms */
.mechs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.mech { background: var(--surface-2); border: 1px solid var(--hair); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.mech h3 { font-size: 15px; line-height: 1.3; }
.mech .stat { font: 500 12.5px var(--f-mono); color: var(--muted); }
.mech p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.eps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
.eplink { font: 500 12px var(--f-mono); text-decoration: none; padding: 2px 8px; border: 1px solid var(--hair); border-radius: 999px; background: var(--surface); }
.eplink:hover { border-color: var(--ink-2); }

/* lists */
.flags { display: grid; gap: 10px; }
.flag { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 10px 12px; border: 1px solid var(--hair); border-radius: var(--r-s); background: var(--surface-2); }
.flag .what { font-size: 13.5px; }
.flag .eps { padding-top: 0; }
.facts { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 6px; }
.facts code { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); }
.recov { display: flex; height: 22px; gap: 2px; margin: 8px 0 10px; }
.recov div { border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* task cards */
.tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.tcard { display: flex; flex-direction: column; gap: 10px; text-decoration: none; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
.tcard:hover { transform: translateY(-2px); border-color: var(--axis); }
.tcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tcard h3 { font-size: 16px; }
.tcard .rate { font: 700 22px var(--f-display); white-space: nowrap; }
.tcard .rate small { font: 500 13px var(--f-body); color: var(--muted); }
.stchips { display: flex; flex-wrap: wrap; gap: 4px; }
.stchip { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--hair); color: var(--ink-2); background: var(--surface-2); }
.stack { display: flex; height: 10px; gap: 2px; }
.stack div { border-radius: 2px; min-width: 2px; }
.tcard .rc { font-size: 12.5px; color: var(--muted); }

/* task view */
.thead { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .thead { grid-template-columns: 1fr; } }
.thead h1 { font-size: clamp(24px, 3vw, 32px); margin: 4px 0 6px; }
.instr { font-size: 15.5px; margin: 0 0 14px; max-width: 70ch; }
.instr small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px; }
.stagelist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.stagelist li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: 13.5px; }
.stbadge { font: 600 12px var(--f-mono); padding: 1px 7px; border-radius: 6px; height: fit-content; }
.stagelist .def { grid-column: 2; color: var(--ink-2); font-size: 13px; }
.stagelist .typ { grid-column: 2; color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); }
.tstats { display: grid; gap: 14px; align-content: start; }
.bigrate { font: 700 44px/1 var(--f-display); }
.bigrate small { font: 500 16px var(--f-body); color: var(--muted); margin-left: 6px; }
details.summary { border-top: 1px solid var(--hair); margin-top: 16px; padding-top: 12px; }
details.summary > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
details.summary > summary::before { content: "+"; font: 600 15px var(--f-mono); width: 20px; height: 20px; display: inline-grid; place-items: center; border: 1px solid var(--hair); border-radius: 6px; }
details.summary[open] > summary::before { content: "−"; }
.prose { font-size: 14px; color: var(--ink-2); max-width: 92ch; }
.prose h1, .prose h2, .prose h3 { color: var(--ink); font-size: 16px; margin: 18px 0 6px; }
.prose p, .prose li { line-height: 1.55; }
.prose code { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); }
.prose table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.prose th, .prose td { border-bottom: 1px solid var(--hair); padding: 4px 10px 4px 0; text-align: left; vertical-align: top; }
.orig { font: 500 10.5px var(--f-body); letter-spacing: .02em; text-transform: none; color: var(--muted); border: 1px solid var(--hair); border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 10; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(8px); padding: 10px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--hair); background: var(--surface); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.count { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }

/* episode card */
.eplist { display: grid; gap: 14px; }
.ep { padding: 16px 18px 18px; display: grid; gap: 14px; scroll-margin-top: 130px; }
.ep.hl { border-color: var(--ink); }
.ephead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.epid { font: 600 20px var(--f-mono); letter-spacing: -.02em; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.pill.ok { color: var(--good-ink); background: color-mix(in srgb, var(--good) 13%, transparent); }
.pill.no { color: var(--bad-ink); background: var(--bad-wash); }
.meta { font-size: 12.5px; color: var(--muted); }
.modechip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--hair); background: var(--surface-2); }
.modechip em { font-style: normal; font-weight: 400; color: var(--ink-2); }
.ephead .acts { margin-left: auto; display: flex; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--hair); background: var(--surface-2); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.dark { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* timeline */
.tl { position: relative; padding-top: 2px; }
.tl-track { position: relative; height: 26px; border-radius: 6px; background: repeating-linear-gradient(90deg, transparent 0 7px, var(--grid) 7px 8px); background-color: var(--surface-2); border: 1px solid var(--hair); overflow: hidden; }
.tl-seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font: 600 11px var(--f-mono); overflow: hidden; white-space: nowrap; border-right: 2px solid var(--surface); }
.tl-seg.fail { background: repeating-linear-gradient(135deg, var(--bad-wash) 0 6px, transparent 6px 12px); color: var(--bad-ink); border-right: 0; }
.tl-rc { position: absolute; top: -1px; bottom: -1px; border: 2px solid var(--bad); border-radius: 5px; background: var(--bad-wash); }
.tl-rest { position: absolute; top: 0; bottom: 0; background: var(--surface-2); opacity: .85; }
.tl-marks { position: relative; height: 40px; margin-top: 3px; }
.tl-mark { position: absolute; top: calc(var(--row) * 19px); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; font: 500 11.5px var(--f-mono); white-space: nowrap; color: var(--ink-2); }
.tl-mark.edge-l { transform: none; }
.tl-mark.edge-r { transform: translateX(-100%); }
.tl-mark i { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); flex: none; }
.tl-mark.ok { color: var(--good-ink); font-weight: 600; }
.tl-mark.to { color: var(--bad-ink); font-weight: 600; }
.tl-axis { position: relative; height: 16px; font: 400 10.5px var(--f-mono); color: var(--muted); }
.tl-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-axis span.first { transform: none; }
.tl-axis span.last { transform: translateX(-100%); }
.tl-axis i { font-style: normal; }

/* clips */
.clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.clip { border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; background: var(--surface-2); display: flex; flex-direction: column; min-width: 0; }
.clip.rc { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.clip-head { display: flex; align-items: center; gap: 6px; padding: 7px 9px; font-size: 12.5px; min-width: 0; }

/* ---------- small builders ---------- */
const stVar = k => `background:var(--st${Math.min(k, 3)});color:var(--st${Math.min(k, 3)}-ink)`;
const short = t => t.replace(/([a-z])([A-Z])/g, "$1 $2");
const epLink = (task, seed) => `<a class="eplink" href="#${task}-s${seed}">${esc(`${short(task)} s${seed}`)}</a>`;
const modeChip = (m, cat, raw) => `<span class="modechip"><span class="sw" style="background:${mcol(m)}"></span>${esc(mLabel(m))}${cat || raw ? ` <em>· ${esc(catName(cat, raw))}</em>` : ""}</span>`;
const origTag = o => o && L().orig ? `<span class="orig">${L().orig}</span>` : "";

function niceTick(h) {
  const target = h / 6;
  for (const n of [100, 200, 250, 500, 1000]) if (n >= target) return n;
  return 1000;
}

/* timeline: x = step / horizon */
function timeline(e, opts = {}) {
  const H = e.horizon, pct = s => (100 * Math.min(Math.max(s, 0), H) / H).toFixed(3);
  const d = e.diag;
  let segs = "";
  for (const s of e.stages) {
    if (!s.clip) continue;
    const [a, b] = s.clip, w = Math.max(0.4, 100 * (b - a) / H);
    if (s.status === "failed") segs += `<div class="tl-seg fail" style="left:${pct(a)}%;width:${w}%">${w > 8 ? `S${s.k} ${L().unfinished}` : ""}</div>`;
    else segs += `<div class="tl-seg" style="left:${pct(a)}%;width:${w}%;${stVar(s.k)}">${w > 3.5 ? `S${s.k}` : ""}</div>`;
  }
  const end = e.success ? (e.success_step ?? e.steps) : e.steps;
  if (end < H) segs += `<div class="tl-rest" style="left:${pct(end)}%;right:0"></div>`;
  if (!e.success && d.root_cause_steps && d.root_cause_steps.length === 2) {
    const [a, b] = d.root_cause_steps;
    segs += `<div class="tl-rc" style="left:${pct(a)}%;width:${Math.max(0.6, 100 * (Math.min(b, H) - a) / H)}%" data-tip="${esc(L().rcTip(a, b, sec(a), sec(b)))}"></div>`;
  }
  const marks = [];
  for (const s of e.stages) if (s.status === "done" && s.logged != null) marks.push({x: s.logged, cls: "", dot: `var(--st${Math.min(s.k, 3)})`, txt: `S${s.k} ✓ ${s.logged}`});
  marks.push(e.success ? {x: end, cls: "ok", dot: "var(--good)", txt: L().succMark(end)} : {x: e.steps, cls: "to", dot: "var(--bad)", txt: `✗ ${e.steps >= H ? L().timeout : L().stopped} ${e.steps}`});
  marks.sort((p, q) => p.x - q.x);
  const lastX = [-1e9, -1e9];
  const mk = marks.map(m => {
    const px = 100 * m.x / H;
    const row = (px - lastX[0] > 13) ? 0 : (px - lastX[1] > 13 ? 1 : 0);
    lastX[row] = px;
    const edge = px < 6 ? "edge-l" : px > 94 ? "edge-r" : "";
    return `<div class="tl-mark ${m.cls} ${edge}" style="left:${px.toFixed(3)}%;--row:${row}"><i style="background:${m.dot}"></i>${esc(m.txt)}</div>`;
  }).join("");
  const tick = niceTick(H);
  let ax = "";
  for (let s = 0; s <= H; s += tick) {
    const cls = s === 0 ? "first" : (H - s < tick * 0.35 ? "last" : "");
    if (cls === "last" && s !== H) continue;
    ax += `<span class="${cls} ${(s / tick) % 2 ? "odd" : ""}" style="left:${pct(s)}%">${s}${s === 0 ? " " + L().step : ""}<i class="s"> · ${Math.round(s * STEP_S)}${L().sec}</i></span>`;
  }
  if (H % tick) ax += `<span class="last" style="left:100%">${H}<i class="s"> · ${Math.round(H * STEP_S)}${L().sec}</i></span>`;
  return `<div class="tl"><div class="tl-track">${segs}${opts.playhead ? '<div class="playhead" style="left:0"></div>' : ""}</div><div class="tl-marks">${mk}</div><div class="tl-axis">${ax}</div></div>`;
}

function posterHtml(s) {
  const p = s.sprite;  // published build: all posters of a task in one image, `cols` x `rows` tiles
  if (!p) return `<img src="${s.poster_img}" alt="" loading="lazy" decoding="async">`;
  const c = p.i % p.cols, r = Math.floor(p.i / p.cols);
  const x = p.cols > 1 ? 100 * c / (p.cols - 1) : 0, y = p.rows > 1 ? 100 * r / (p.rows - 1) : 0;
  return `<span class="spr" style="background-image:url(${p.src});background-size:${p.cols * 100}% ${p.rows * 100}%;background-position:${x.toFixed(4)}% ${y.toFixed(4)}%"></span>`;
}

function clipTile(task, e, s) {
  const d = e.diag, isRc = !e.success && d.root_cause_stage === s.k, T = L();
  const name = `S${s.k} · ${esc(short(s.skill))}`;
  if (!s.clip) {
    return `<div class="clip na"><div class="clip-head"><span class="sw" style="background:var(--st${Math.min(s.k, 3)})"></span><span class="nm">${name}</span>${isRc ? `<span class="st no">${T.rootCause}</span>` : `<span class="st">${T.notReached}</span>`}</div><div class="clip-media">${T.stageNotReached}</div><div class="clip-foot"><span>—</span></div></div>`;
  }
  // two stages logged in the same policy chunk leave an empty clip: show the 6 s before the completion instead
  const b = s.clip[1], a = b - s.clip[0] < 40 ? Math.max(0, b - 120) : s.clip[0];
  let st;
  if (s.status === "failed") st = `<span class="st no">✗ ${isRc ? T.rootCause : T.unfinished}</span>`;
  else st = `<span class="st ok">✓ ${s.logged ?? e.success_step ?? e.steps}</span>${isRc ? ` <span class="st no">${T.rootCause}</span>` : ""}${!e.success && s.undone_real ? ` <span class="st no" title="${esc(T.undoneTip)}">${T.undone}</span>` : ""}`;
  return `<div class="clip ${isRc ? "rc" : ""}">
    <div class="clip-head"><span class="sw" style="background:var(--st${Math.min(s.k, 3)})"></span><span class="nm" title="${esc(s.skill)}">${name}</span>${st}</div>
    <button type="button" class="clip-media" data-task="${task}" data-seed="${e.seed}" data-a="${a}" data-b="${b}" aria-label="${esc(T.playAria(s.k, a, b))}">
      ${posterHtml(s)}<video muted playsinline preload="none"></video>
      <span class="vlab l">${T.scene}</span><span class="vlab r">${T.wrist}</span><span class="playic"></span>
      <span class="stepread">${esc(T.stepRead(s.poster, sec(s.poster)))}</span><span class="segprog"><i></i></span>
    </button>
    <div class="clip-foot"><span>${esc(T.stepsRange(a, b))}</span><span>${sec(b - a)} ${T.sec}</span></div>
  </div>`;
}

function clampBlock(label, t, cls = "") {
  if (!t.s) return "";
  return `<div><h4>${label}${origTag(t.orig)}</h4><p class="${cls} clamp">${esc(t.s)}</p><button type="button" class="more" hidden>${L().showAll}</button></div>`;
}

function epCard(task, e) {
  const d = e.diag, T = L(), TK = BYTASK[task];
  const head = `<div class="ephead">
    <span class="epid">s${e.seed}</span>
    ${e.success ? `<span class="pill ok">✓ ${T.success}</span>` : `<span class="pill no">✗ ${T.failed}</span>`}
    ${!e.success ? modeChip(d.mode, d.category, d.category_raw) : ""}
    <span class="meta">${esc(T.layout(e.layout, e.style))}${Object.keys(e.objects).length ? " · " + esc(Object.values(e.objects).join(", ")) : ""}</span>
    <span class="acts">${d.sheets.length ? `<button type="button" class="btn" data-sheets="${task}|${e.seed}">${T.evidence} · ${d.sheets.length}</button>` : ""}<button type="button" class="btn dark" data-full="${task}|${e.seed}">${T.fullRollout}</button></span>
  </div>`;
  const clips = `<div class="clips">${e.stages.map(s => clipTile(task, e, s)).join("")}</div>`;
  let diag;
  if (e.success) {
    diag = `<div class="diag"><div>${clampBlock(T.whatHappened, txt(d, "what_happened"))}</div><div class="dfacts">${clampBlock(T.recovered, txt(d, "self_recovery"))}</div></div>`;
  } else {
    const rcStage = d.root_cause_stage != null ? `S${d.root_cause_stage} · ${short(TK.stages[d.root_cause_stage] || "")}` : "—";
    const rs = d.root_cause_steps && d.root_cause_steps.length === 2 ? T.rcSteps(d.root_cause_steps[0], d.root_cause_steps[1], sec(d.root_cause_steps[0]), sec(d.root_cause_steps[1])) : "";
    const chain = txt(d, "causal_chain");
    const catRaw = String(d.category_raw || "");
    const catDetail = catRaw.startsWith("other") ? human(catRaw) : "";
    diag = `<div class="diag">
      <div style="display:grid;gap:12px;align-content:start">
        <div class="rcline"><b>${esc(T.rcLine(rcStage))}</b><span class="meta">${esc(rs)}</span>${d.failed_stage != null && d.failed_stage !== d.root_cause_stage ? `<span class="meta">${esc(T.firstUnfinished(d.failed_stage))}</span>` : ""}<span class="conf">${esc(T.confidence(T.conf[d.confidence] || d.confidence || "?"))}</span></div>
        <div><h4>${T.causal}${origTag(chain.orig)}</h4><p class="chain">${esc(chain.s)}</p></div>
        ${clampBlock(T.whatHappened, txt(d, "what_happened"))}
      </div>
      <div class="dfacts">
        <div><h4>${T.category}</h4><p>${esc(catName(d.category, d.category_raw))}${catDetail && LANG === "zh" ? `<br><span class="meta">${esc(catDetail)}</span>` : (catDetail ? "" : "")}</p>${d.secondary.length ? `<div class="sec" style="margin-top:6px">${d.secondary.map(x => `<span>${esc(secName(x))}</span>`).join("")}</div>` : ""}</div>
        ${clampBlock(T.selfRec, txt(d, "self_recovery"))}
        ${clampBlock(T.critNotes, txt(d, "criterion"))}
        ${clampBlock(T.uncertain, txt(d, "uncertain"))}
      </div>
    </div>`;
  }
  return `<article class="card ep" id="ep-${task}-s${e.seed}">${head}${timeline(e)}${clips}${diag}</article>`;
}

function overview() {
  const T = L();
  const nS = ALL.filter(x => x.e.success).length, nF = FAILS.length;
  const modeCount = Object.fromEntries(MODES.map(m => [m, FAILS.filter(x => x.e.diag.mode === m).length]));
  const maxM = Math.max(...Object.values(modeCount));
  const catsOf = m => {
    const c = {};
    FAILS.filter(x => x.e.diag.mode === m).forEach(x => c[x.e.diag.category] = (c[x.e.diag.category] || 0) + 1);
    return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${catName(k)} ${v}`).join(" · ");
  };
  const rcFirst = FAILS.filter(x => x.e.diag.root_cause_stage === x.e.diag.failed_stage).length;
  const recov = {none: 0, tried: 0, partial: 0};
  FAILS.forEach(x => {
    const s = (x.e.diag.self_recovery || "").trim().toLowerCase();
    if (!s || s.startsWith("none")) recov.none++;
    else if (/\b(succeed|worked|recovered|fixed)/.test(s) && !/(n't|not|never|failed|no) (work|succeed|recover)/.test(s)) recov.partial++;
    else recov.tried++;
  });
  const timeSec = FAILS.filter(x => (x.e.diag.secondary || []).some(s => String(s).startsWith("ran_out_of_time"))).length;
  const C = overviewContent(nS, nF, modeCount, recov);

  const heatRows = TASKS.map(t => {
    const f = t.episodes.filter(e => !e.success);

      return `<td class="cnt" data-go="${t.task}" data-tip="${esc(T.heatTip(short(t.task), mLabel(m), n, f.length))}" style="${n ? `background:rgba(var(--heat),${a.toFixed(2)});color:${ink}` : "color:var(--axis)"}">${n || "·"}</td>`;
    }).join("");
    return `<tr class="row"><td class="task"><a href="#${t.task}">${esc(short(t.task))}</a></td>
      <td class="succ"><div class="minibar"><i style="width:${Math.max(2, 70 * t.successes / 30)}px"></i><span class="num">${t.successes}/30</span></div></td>
      ${cells}<td class="num" style="color:var(--ink-2)">${f.length}</td></tr>`;

  const recTot = recov.none + recov.tried + recov.partial;
  const pqCols = ["1/3", "3/5", "5/6", "6/7"];
  return `
  <section class="hero">
    <div>
      <div class="eyebrow">${T.heroEyebrow}</div>
      <h1>${T.heroH}</h1>
      <p>${T.heroP}</p>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v">${nS}<small>/ 480</small></div><div class="l">${T.kSucc((100 * nS / 480).toFixed(1))}</div></div>
      <div class="kpi"><div class="v">${nF}</div><div class="l">${T.kFail}</div></div>
      <div class="kpi"><div class="v">${Math.round(100 * recov.none / nF)}%<small>${recov.none}/${nF}</small></div><div class="l">${T.kNoRec}</div></div>
      <div class="kpi"><div class="v">0</div><div class="l">${T.kTime(timeSec)}</div></div>

    <p class="sub">${T.pipeSub}</p>
    <div class="pipe">${C.pipeline.map((s, i) => `<div class="pstep"><span class="n">${i + 1}</span><h3>${s.h}</h3><span class="tag ${s.cls || ""}">${s.tag}</span><p>${s.p}</p><div class="out">→ <b>${s.out}</b></div></div>`).join("")}</div>
    <div class="pipe-q">${T.pipeQ.map((q, i) => `<div style="grid-column:${pqCols[i]}">${q}</div>`).join("")}</div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>${T.modesH}</h2>
      <p class="sub">${T.modesSub(nF)}</p>
      <div class="mbars">${MODES.map(m => `<div class="mbar" data-tip="${esc(catsOf(m))}">
        <div class="name"><span class="sw" style="background:${mcol(m)}"></span>${esc(mLabel(m))}</div>
        <div class="track"><div class="fill" style="width:${(78 * modeCount[m] / maxM).toFixed(1)}%;background:${mcol(m)}"></div><span class="val" style="left:${(78 * modeCount[m] / maxM).toFixed(1)}%">${modeCount[m]} · ${Math.round(100 * modeCount[m] / nF)}%</span></div>

          <div style="flex:${recov.partial};background:var(--st0)" data-tip="${esc(T.recPartial)}: ${recov.partial}"></div>
        </div>
        <div class="legend"><span><span class="sw" style="background:var(--st3)"></span>${T.recNone} ${recov.none} (${Math.round(100 * recov.none / recTot)}%)</span><span><span class="sw" style="background:var(--st2)"></span>${T.recTried} ${recov.tried}</span><span><span class="sw" style="background:var(--st0)"></span>${T.recPartial} ${recov.partial}</span></div>
      </div>
      <div style="margin-top:20px;display:grid;gap:8px">
        <h3 style="font-size:15px">${T.whereH}</h3>

  <section class="card">

      <tbody>${heatRows}</tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>${T.mechH}</h2>
    <p class="sub">${T.mechSub}</p>
    <div class="mechs">${C.mech.map((m, i) => `<div class="mech"><h3>${esc(m.h)}</h3><div class="stat">${esc(m.stat)}</div><p>${esc(m.p)}</p><div class="eps">${MECH_EPS[i].map(([t, s]) => epLink(t, s)).join("")}</div></div>`).join("")}</div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>${T.flagsH}</h2>
      <p class="sub">${T.flagsSub}</p>
      <div class="flags">
        <div class="eyebrow">${T.flagsOkH}</div>
        ${C.flagsOk.map((w, i) => `<div class="flag"><div class="what">${esc(w)}</div><div class="eps">${FLAG_OK_EPS[i].map(([t, s]) => epLink(t, s)).join("")}</div></div>`).join("")}
        <div class="eyebrow" style="margin-top:6px">${T.flagsNoH}</div>
        ${C.flagsNo.map((w, i) => `<div class="flag"><div class="what">${esc(w)}</div><div class="eps">${FLAG_NO_EPS[i].map(([t, s]) => epLink(t, s)).join("")}</div></div>`).join("")}

  </section>`;
}

function taskCard(t) {
  const f = t.episodes.filter(e => !e.success);
  const rc = {};
  f.forEach(e => { const k = e.diag.root_cause_stage; rc[k] = (rc[k] || 0) + 1; });
  const stack = MODES.map(m => [m, f.filter(e => e.diag.mode === m).length]).filter(x => x[1]);
  return `<a class="tcard" href="#${t.task}">
    <div class="top"><h3>${esc(short(t.task))}</h3><span class="rate">${t.successes}<small>/30</small></span></div>
    <div class="stchips">${t.stages.map((s, k) => `<span class="stchip">S${k} ${esc(short(s))}</span>`).join("")}</div>
    <div class="stack">${stack.map(([m, n]) => `<div style="flex:${n};background:${mcol(m)}" data-tip="${esc(mLabel(m))}: ${n}"></div>`).join("") || '<div style="flex:1;background:var(--grid)"></div>'}</div>
    <div class="rc">${esc(L().tcardRc(f.length, Object.entries(rc).sort().map(([k, n]) => `S${k} ${n}`).join(" · ") || "—"))}</div>
  </a>`;
}

const FILTER = {status: "fail", mode: null};
function taskView(task) {
  const T = L(), t = BYTASK[task];
  const f = t.episodes.filter(e => !e.success);
  const idx = TASKS.findIndex(x => x.task === task);
  const prev = TASKS[(idx + TASKS.length - 1) % TASKS.length].task, next = TASKS[(idx + 1) % TASKS.length].task;
  const stack = MODES.map(m => [m, f.filter(e => e.diag.mode === m).length]).filter(x => x[1]);
  const defs = t.stage_definitions || [];
  const stages = t.stages.map((s, k) => {
    const ty = t.typical[k] || t.typical[String(k)];
    return `<li><span class="stbadge" style="${stVar(k)}">S${k}</span><b>${esc(short(s))}</b>
      ${defs[k] ? `<span class="def">${T.doneWhen}${esc(stageDef(task, k, defs[k].counts_as_complete))}</span>` : ""}
      ${ty ? `<span class="typ">${esc(T.typical(ty.median, sec(ty.median), ty.p90))}</span>` : ""}</li>`;
  }).join("");
  const sumZh = LANG === "zh" && t.summary_html_zh;
  return `
  <section class="card">
    <div class="thead">
      <div>
        <div class="eyebrow">${esc(T.taskOf(idx + 1, t.horizon, Math.round(t.horizon * STEP_S)))}</div>
        <h1>${esc(short(task))}</h1>
        <p class="instr"><small>${T.instrLbl}</small>“${esc(t.instruction)}”</p>
        <ul class="stagelist">${stages}</ul>
      </div>
      <div class="tstats">
        <div><div class="bigrate">${t.successes}<small>${T.succOf30}</small></div></div>
        <div><div class="eyebrow" style="margin-bottom:6px">${esc(T.failByMode(f.length))}</div>
          <div class="stack" style="height:14px">${stack.map(([m, n]) => `<div style="flex:${n};background:${mcol(m)}" data-tip="${esc(mLabel(m))}: ${n}"></div>`).join("") || '<div style="flex:1;background:var(--grid)"></div>'}</div>
          <div class="legend" style="margin-top:8px">${stack.map(([m, n]) => `<span><span class="sw" style="background:${mcol(m)}"></span>${esc(mLabel(m))} ${n}</span>`).join("")}</div>
        </div>
        <div class="legend"><span><span class="sw" style="background:var(--st0)"></span><span class="sw" style="background:var(--st1)"></span><span class="sw" style="background:var(--st2)"></span>${T.lgDone}</span><span><span class="sw" style="background:var(--bad-wash);outline:1px solid var(--bad)"></span>${T.lgRc}</span><span><span class="sw" style="background:repeating-linear-gradient(135deg,var(--bad-wash) 0 3px,transparent 3px 6px)"></span>${T.lgUnf}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#${prev}">← ${esc(short(prev))}</a><a class="btn" href="#${next}">${esc(short(next))} →</a></div>
      </div>
    </div>
    <details class="summary"><summary>${T.summaryLbl}${LANG === "zh" && !sumZh ? `<span class="orig">${T.orig}</span>` : ""}</summary><div class="prose">${sumZh || t.summary_html}</div></details>
  </section>
  <div class="filters" id="filters">
    <div class="seg" role="group">
      <button type="button" data-status="all" aria-pressed="${FILTER.status === "all"}">${T.all} <span class="count">30</span></button>
      <button type="button" data-status="fail" aria-pressed="${FILTER.status === "fail"}">${T.fail} <span class="count">${f.length}</span></button>
      <button type="button" data-status="ok" aria-pressed="${FILTER.status === "ok"}">${T.ok} <span class="count">${30 - f.length}</span></button>
    </div>
    <div class="chips">${stack.map(([m, n]) => `<button type="button" class="chip" data-mode="${m}" aria-pressed="${FILTER.mode === m}"><span class="sw" style="background:${mcol(m)}"></span>${esc(mLabel(m))} <span class="count">${n}</span></button>`).join("")}</div>
  </div>
  <div class="eplist" id="eplist"></div>`;
}

function renderEpisodes(task) {
  const t = BYTASK[task];
  let eps = t.episodes;
  if (FILTER.status === "fail") eps = eps.filter(e => !e.success);
  if (FILTER.status === "ok") eps = eps.filter(e => e.success);
  if (FILTER.mode) eps = eps.filter(e => !e.success && e.diag.mode === FILTER.mode);
  $("#eplist").innerHTML = eps.length ? eps.map(e => epCard(task, e)).join("") : `<div class="card empty">${L().empty}</div>`;
  armClamps($("#eplist"));
}

function armClamps(root) {
  requestAnimationFrame(() => root.querySelectorAll(".clamp").forEach(p => {
    const b = p.nextElementSibling;
    if (b && b.classList.contains("more") && p.scrollHeight > p.clientHeight + 2) b.hidden = false;
  }));
}

const BAR_KEYS = ["plain", "best4", "greedy", "search"];
const BAR_COL = ["var(--st1)", "var(--st2)", "rgba(var(--heat),.45)", "rgb(var(--heat))"];
let CTASK = CE.tasks[0].task;

function ceilingView() {
  const U = UB[LANG], ts = CE.tasks;
  const pct = x => (100 * x).toFixed(1);
  const ratio = ts.map(t => t.summary.calls_search / t.summary.calls_plain);
  const F = ts.map(t => {
    const s = t.summary;
    return {task: short(t.task), gain: 100 * (s.search - s.plain), bt: 100 * (s.search - s.greedy), b4: 100 * s.best4, se: 100 * s.search,
      newly: t.scenes.filter(x => x.ok && !x.plain.some(Boolean)).length};
  });
  F.r = {}; ts.forEach(t => Object.entries(t.reasons).forEach(([k, n]) => { F.r[k] = (F.r[k] || 0) + n; }));
  F.tot = Object.values(F.r).reduce((a, b) => a + b, 0);
  const pf = CE.probe.filter(p => p.role === "fail");

  const kpis = ts.map(t => `<div class="kpi"><div class="v">${pct(t.summary.search)}%<small>${U.from(pct(t.summary.plain))}</small></div><div class="l">${esc(U.kpiL(short(t.task), t.n_stages))}</div></div>`).join("")
    + `<div class="kpi"><div class="v">${Math.min(...ratio).toFixed(1)}–${Math.max(...ratio).toFixed(1)}×</div><div class="l">${U.kpiCost}</div></div>`;
  const bars = ts.map(t => `<div class="ubgroup"><h3>${esc(short(t.task))}<span>${U.stagesN(t.n_stages)}</span></h3>${BAR_KEYS.map((k, i) => {
    const v = t.summary[k], w = (82 * v).toFixed(1);
    return `<div class="ubbar${k === "search" ? " hi" : ""}" data-tip="${esc(U.barTips[i])}"><span>${U.bars[i]}</span><div class="track"><div class="fill" style="width:${w}%;background:${BAR_COL[i]}"></div><span class="val" style="left:${w}%">${pct(v)}%</span></div></div>`;
  }).join("")}</div>`).join("");
  const cost = ts.map((t, i) => `<tr><td>${esc(short(t.task))}</td><td>${Math.round(t.summary.calls_plain)}</td><td>${Math.round(t.summary.calls_best4)}</td><td>${Math.round(t.summary.calls_search)}</td><td>${ratio[i].toFixed(1)}×</td></tr>`).join("");
  const fails = ts.map(t => `<div class="ubfail"><b>${esc(short(t.task))}</b><span class="meta">${U.failOf(Object.values(t.reasons).reduce((a, b) => a + b, 0))}</span>${Object.entries(t.reasons).map(([k, n]) => `<span class="modechip">${n} <em>${esc(U.reasons[k])}</em></span>`).join("")}</div>`).join("");
  const shows = ts.map(t => {
    const sc = t.scenes.find(x => x.seed === t.showcase.seed);
    const ep = BYTASK[t.task] && BYTASK[t.task].episodes.find(x => x.seed === t.showcase.seed);
    return `<div class="show"><div class="show-head"><h3>${esc(short(t.task))} s${sc.seed}</h3><span class="pill no">${U.plain04}</span><span class="pill ok">${U.searchOk(sc.steps)}</span>${sc.bt ? `<span class="modechip">${U.bt}</span>` : ""}</div>
      <div class="vids">
        ${ep ? `<div class="vid"><video controls muted playsinline preload="metadata" src="${esc(ep.video)}"></video><div class="cap">${U.plainVid}</div></div>` : ""}
        <div class="vid"><video controls muted playsinline preload="metadata" src="${esc(t.showcase.video)}"></video><div class="cap">${U.searchVid} ${t.showcase.segs.map(s => `<span class="stbadge" style="${stVar(s.k)}">${esc(U.seg(s.k, s.steps))}</span>`).join("")}</div></div>
      </div></div>`;
  }).join("");
  const cell = (cls, w) => `<span class="cell ${cls}">${w != null ? `<i style="width:${w}%"></i>` : ""}</span>`;
  const probes = CE.probe.map(p => `<div class="prb"><div class="lbl"><span class="mono">s${p.seed} · ${U.stepAt(p.t0)}</span><small>${U.role[p.role]}</small></div><span class="sq" role="img" aria-label="${p.success}/${p.n}">${Array.from({length: p.n}, (_, i) => `<i class="${i < p.success ? "y" : ""}"></i>`).join("")}</span><span class="n">${p.success}/${p.n}</span></div>`).join("");
  return `
  <section class="hero">
    <div><div class="eyebrow">${U.eyebrow}</div><h1>${U.h}</h1><p>${U.p}</p></div>
    <div class="kpis">${kpis}</div>
  </section>
  <section class="card">
    <h2>${U.methodH}</h2><p class="sub">${U.methodSub}</p>
    <div class="pipe p5">${U.steps.map((s, i) => `<div class="pstep"><span class="n">${i + 1}</span><h3>${s.h}</h3><p>${s.p}</p><div class="out">→ <b>${s.out}</b></div></div>`).join("")}</div>
    <div class="ubset">${ts.map(t => `<div><b>${esc(short(t.task))}</b>${esc(U.setRow(t))}</div>`).join("")}</div>
  </section>
  <div class="grid2">
    <section class="card"><h2>${U.resH}</h2><p class="sub">${U.resSub}</p><div class="ubgroups">${bars}</div></section>
    <section class="card"><h2>${U.costH}</h2><p class="sub">${U.costSub}</p>
      <div class="tablewrap"><table class="ubtab"><thead><tr>${U.costTh.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${cost}</tbody></table></div>
      <h3 style="font-size:15px;margin-top:22px">${U.failH}</h3><div class="ubfails">${fails}</div>
    </section>
  </div>
  <section class="card"><h2>${U.findH}</h2>
    <div class="mechs" style="margin-top:10px">${U.finds(F).map(f => `<div class="mech"><h3>${esc(f.h)}</h3><div class="stat">${esc(f.stat)}</div><p>${esc(f.p)}</p></div>`).join("")}</div>
  </section>
  <section class="card"><h2>${U.showH}</h2><p class="sub">${U.showSub}</p><div class="shows">${shows}</div></section>
  <section class="card"><h2>${U.sceneH}</h2><p class="sub">${U.sceneSub}</p>
    <div class="seg ubseg" role="group">${ts.map(t => `<button type="button" data-ctask="${t.task}" aria-pressed="${t.task === CTASK}">${esc(short(t.task))} <span class="count">${Math.round(30 * t.summary.search)}/30</span></button>`).join("")}</div>
    <div class="tlg">
      <span>${cell("done")}${U.lg.done}</span><span>${cell("done kept")}${U.lg.kept}</span>
      <span>${cell("done kept chosen")}${U.lg.chosen}</span><span>${cell("", 40)}${U.lg.open}</span>
    </div>
    <div class="scns" id="ubScenes">${sceneList()}</div>
  </section>
  <div class="grid2">
    <section class="card"><h2>${U.probeH}</h2><p class="sub">${U.probeSub}</p><div class="probes">${probes}</div>
      <p class="sub" style="margin:14px 0 0">${U.probeNote(pf.filter(p => p.success > 0).length, pf.length)}</p></section>
    <section class="card"><h2>${U.capH}</h2><ul class="facts" style="margin-top:10px">${U.caps.map(c => `<li>${c}</li>`).join("")}</ul>
      <h3 style="font-size:15px;margin-top:20px">${U.nextH}</h3><p class="sub" style="margin:4px 0 0">${U.next}</p></section>
  </div>`;
}

function sceneList() {
  const U = UB[LANG], t = CE.tasks.find(x => x.task === CTASK);
  return t.scenes.map(sc => {
    const chosen = new Map(sc.path.map(([ei, i]) => [ei, i]));
    const rows = sc.exps.map((e, ei) => {
      const on = chosen.has(ei);
      return `<div class="trow${on ? "" : " off"}" style="--ind:${e.k}"><span class="tl2">${U.exp(ei, e.k, e.t, e.L)}</span><span class="cells">${e.c.map((c, i) =>
        `<span class="cell${c[0] ? " done" : ""}${e.fin.includes(i) ? " kept" : ""}${chosen.get(ei) === i ? " chosen" : ""}" data-tip="${esc(U.cTip(i, c, e.k))}">${c[0] ? "" : `<i style="width:${Math.round(100 * c[2])}%"></i>`}</span>`).join("")}</span>${on ? "" : `<span class="ab">${U.abandoned}</span>`}</div>`;
    }).join("");
    return `<details class="scn"><summary><span class="sid">s${sc.seed}</span><span class="dots">${sc.plain.map((x, p) => `<i class="${x == null ? "na" : x ? "y" : ""}" data-tip="${esc(U.plainTip(p, x))}"></i>`).join("")}</span>${sc.ok ? `<span class="pill ok">${U.ok(sc.steps)}</span>` : `<span class="pill no">${esc(U.no(U.reasons[sc.reason]))}</span>`}${sc.bt ? `<span class="modechip">${U.bt}</span>` : ""}<span class="meta2">${U.cands(sc.cands)} · ${U.calls(sc.calls)}</span></summary><div class="trace">${rows}</div></details>`;
  }).join("");
}

function stageSegs(e, H) {
  const ends = e.hist.map(([t]) => t), out = [];
  let a = 0;
  for (let k = 0; a < e.steps; k++) {
    const b = ends[k] != null ? ends[k] : e.steps;
    if (b > a) out.push({k, a, b});
    if (ends[k] == null) break;
    a = b;
  }
  return out.map(s => ({...s, l: 100 * s.a / H, w: 100 * (s.b - s.a) / H}));
}

function dataAll() {
  const U = DT[LANG], t = DTD.tasks.find(x => x.task === DTASK), H = t.horizon;
  const pd = p => p.g.filter(c => c[0]).length / p.g.length;
  const rows = t.episodes.map(e => `<div class="estrip"><span class="el${e.ok ? " ok" : ""}">${esc(U.epLbl(e))}</span><div class="track">
      ${stageSegs(e, H).map(s => `<div class="sg" style="left:${s.l}%;width:${s.w}%;${stVar(s.k)};opacity:.55"></div>`).join("")}
      <span class="end" style="left:${(100 * e.steps / H).toFixed(2)}%" data-tip="${esc(U.lgEnd)}: ${e.steps}"></span>
      ${e.points.map(p => `<button type="button" class="dp" data-dp="${e.seed}|${p.t}" aria-pressed="${DSEL.seed === e.seed && DSEL.t === p.t}" style="left:${(100 * p.t / H).toFixed(2)}%;background:${pcol(pd(p))}" data-tip="${esc(`t=${p.t} · S${p.k} · ${p.g.filter(c => c[0]).length}/16`)}"></button>`).join("")}
    </div></div>`).join("");
  return `<p class="sub" style="margin:6px 0 2px">${esc(U.stats(t))}${t.n_points < t.n_jobs ? ` · <b>${U.inProg}</b>` : ""}</p>
    <p class="sub" style="margin:0 0 2px">${esc(U.mix(t))}</p>
    ${t.same != null ? `<p class="sub" style="margin:0">${esc(U.agree(t))}</p>` : ""}
    <div class="legend" style="margin-top:10px"><span>${[0, 1, 2, 3].slice(0, t.per_stage.length).map(k => `<span class="sw" style="${stVar(k)}"></span>`).join("")}${U.lgStage}</span><span><span class="dtgrad"></span>${U.lgDot}</span><span><span class="sw" style="background:var(--ink-2);width:3px"></span>${U.lgEnd}</span></div>
    <div class="dtwrap"><div class="estrips">${rows}</div><div class="dtdet" id="dtDet">${dataDetail()}</div></div>`;
}

function dataDetail() {
  const U = DT[LANG], t = DTD.tasks.find(x => x.task === DTASK);
  const e = t.episodes.find(x => x.seed === DSEL.seed), p = e && e.points.find(x => x.t === DSEL.t);
  if (!p) return `<p class="sub" style="margin:0">${U.noPick}</p>`;
  const n = p.g.filter(c => c[0]).length;
  return `<h3>${esc(short(t.task))} ${esc(U.det(e, p, t))}</h3><p class="sub" style="margin:0">${U.detN(n)}</p>

}

const app = $("#app");
function route() {
  stopAll();
  const h = decodeURIComponent(location.hash.slice(1));
  $("#navCeiling").setAttribute("aria-current", h === "ceiling" ? "page" : "false");
  $("#navData").setAttribute("aria-current", h === "data" ? "page" : "false");
  if (h === "ceiling" || h === "data") {
    $("#navOverview").setAttribute("aria-current", "false");
    if (app.dataset.view !== h) { app.innerHTML = h === "ceiling" ? ceilingView() : dataView(); app.dataset.view = h; prepVideos(); }
    sel.value = ""; window.scrollTo(0, 0);
    return;
  }
  const m = h.match(/^([A-Za-z]+)(?:-s(\d+))?$/);
  $("#navOverview").setAttribute("aria-current", BYTASK[m && m[1]] ? "false" : "page");
  if (m && BYTASK[m[1]]) {
    const task = m[1], seed = m[2] != null ? +m[2] : null;
    if (seed != null && BYTASK[task].episodes.some(x => x.seed === seed)) { FILTER.status = "all"; FILTER.mode = null; }
    if (app.dataset.view !== task) {
      if (seed == null) FILTER.mode = null;
      app.innerHTML = taskView(task); app.dataset.view = task;
    } else {
      syncFilters();
    }
    sel.value = task;
    renderEpisodes(task);
    if (seed != null) {
      const el = document.getElementById(`ep-${task}-s${seed}`);
      if (el) { el.classList.add("hl"); el.scrollIntoView({block: "start"}); }
    } else window.scrollTo(0, 0);
  } else {
    if (app.dataset.view !== "overview") { app.innerHTML = overview(); app.dataset.view = "overview"; }
    sel.value = "";
    if (h === "tasks" || h === "pipeline") { const el = document.getElementById(h); if (el) el.scrollIntoView(); }
    else window.scrollTo(0, 0);
  }
}
function syncFilters() {
  document.querySelectorAll("#filters [data-status]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.status === FILTER.status)));
  document.querySelectorAll("#filters [data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === FILTER.mode)));
}
window.addEventListener("hashchange", route);

/* ---------- task select, speed, language ---------- */
const sel = $("#taskSelect");
sel.addEventListener("change", () => { location.hash = sel.value || "overview"; });
function setRate(r) {
  RATE = r;
  try { localStorage.setItem("s480.rate", String(r)); } catch (e) {}
  document.querySelectorAll("#speedSeg button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.rate === r)));
  document.querySelectorAll("video").forEach(v => { v.playbackRate = r; });
}
$("#speedSeg").addEventListener("click", ev => { const b = ev.target.closest("button[data-rate]"); if (b) setRate(+b.dataset.rate); });
function setLang(l) {
  if (l === LANG) return;
  LANG = l;
  try { localStorage.setItem("s480.lang", l); } catch (e) {}
  stopAll();
  const y = window.scrollY, view = app.dataset.view;
  applyChrome();
  if (view === "overview") app.innerHTML = overview();
  else if (view === "ceiling") { app.innerHTML = ceilingView(); prepVideos(); }
  else if (view === "data") { app.innerHTML = dataView(); prepVideos(); }
  else if (BYTASK[view]) { app.innerHTML = taskView(view); renderEpisodes(view); }
  window.scrollTo(0, y);
}
$("#langSeg").addEventListener("click", ev => { const b = ev.target.closest("button[data-lang]"); if (b) setLang(b.dataset.lang); });

/* ---------- clip playback ---------- */
function stopAll(except) {
  document.querySelectorAll(".clip-media.playing").forEach(m => { if (m !== except) { const v = m.querySelector("video"); v.pause(); m.classList.remove("playing"); } });
}
function playClip(btn) {
  const v = btn.querySelector("video");
  const a = +btn.dataset.a, b = +btn.dataset.b, t0 = tOf(a), t1 = Math.max(tOf(b), t0 + 0.2);
  if (btn.classList.contains("playing")) { v.pause(); btn.classList.remove("playing"); return; }
  stopAll(btn);
  const e = BYTASK[btn.dataset.task].episodes.find(x => x.seed === +btn.dataset.seed);
  if (!v.src) {
    v.src = e.video;
    v.addEventListener("loadedmetadata", () => { v.currentTime = t0; }, {once: true});
    v.addEventListener("timeupdate", () => {
      const t = v.currentTime;
      if (t >= t1 - 0.02 || t < t0 - 0.3) { v.currentTime = t0; }
      const st = Math.min(stepOf(t), b);
      btn.querySelector(".stepread").textContent = L().stepRead(st, sec(st));
      btn.querySelector(".segprog i").style.width = `${Math.min(100, Math.max(0, 100 * (t - t0) / (t1 - t0)))}%`;
    });
    v.addEventListener("playing", () => btn.classList.add("live"), {once: true});
  } else if (v.currentTime < t0 - 0.3 || v.currentTime >= t1) v.currentTime = t0;
  v.playbackRate = RATE;
  btn.classList.add("playing");
  const p = v.play(); if (p && p.catch) p.catch(() => btn.classList.remove("playing"));
}

/* ---------- full rollout player ---------- */
const plDlg = $("#playerDlg"), plV = $("#plVideo");
let PL = null;
function openPlayer(task, seed, startStep) {
  stopAll();
  const T = L(), e = BYTASK[task].episodes.find(x => x.seed === seed);
  PL = {task, e};
  $("#plTitle").textContent = T.plTitle(short(task), seed, e.success);
  $("#plTl").innerHTML = timeline(e, {playhead: true});
  $("#plJumps").innerHTML = e.stages.filter(s => s.clip).map(s => `<button type="button" class="btn" data-jump="${s.clip[0]}">${esc(T.jumpStage(s.k, s.clip[0]))}</button>`).join("")
    + (!e.success && e.diag.root_cause_steps ? `<button type="button" class="btn" data-jump="${e.diag.root_cause_steps[0]}" style="border-color:var(--bad)">${esc(T.jumpRc(e.diag.root_cause_steps[0]))}</button>` : "");
  plV.src = e.video; plV.playbackRate = RATE;
  plV.addEventListener("loadedmetadata", () => { plV.currentTime = tOf(startStep || 0); }, {once: true});
  plDlg.showModal();
  const p = plV.play(); if (p && p.catch) p.catch(() => {});
}
function plUpdate() {
  if (!PL) return;
  const T = L(), st = Math.min(stepOf(plV.currentTime), PL.e.steps);
  $("#plRead").textContent = T.stepRead(st, sec(st));
  const cur = PL.e.stages.find(s => s.clip && st >= s.clip[0] && st <= s.clip[1]);
  $("#plStage").textContent = cur ? T.inStage(cur.k, short(cur.skill)) : "";
  const ph = $("#plTl .playhead"); if (ph) ph.style.left = `${100 * st / PL.e.horizon}%`;
  $("#plPlay").textContent = plV.paused ? T.play : T.pause;
}
plV.addEventListener("timeupdate", plUpdate); plV.addEventListener("play", plUpdate); plV.addEventListener("pause", plUpdate);
$("#plPlay").addEventListener("click", () => { if (plV.paused) plV.play(); else plV.pause(); });
$("#plClose").addEventListener("click", () => plDlg.close());
plDlg.addEventListener("close", () => { plV.pause(); plV.removeAttribute("src"); plV.load(); PL = null; });
$("#plTl").addEventListener("click", ev => {
  const tr = ev.target.closest(".tl-track"); if (!tr || !PL) return;
  const r = tr.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width;
  plV.currentTime = tOf(Math.round(x * PL.e.horizon));
});
$("#plJumps").addEventListener("click", ev => { const b = ev.target.closest("[data-jump]"); if (b) { plV.currentTime = tOf(+b.dataset.jump); plV.play(); } });
plDlg.addEventListener("keydown", ev => {
  if (ev.key === " ") { ev.preventDefault(); plV.paused ? plV.play() : plV.pause(); }
  if (ev.key === "ArrowRight") plV.currentTime += 16 / 40;
  if (ev.key === "ArrowLeft") plV.currentTime = Math.max(0, plV.currentTime - 16 / 40);
});

/* ---------- evidence sheets ---------- */
const shDlg = $("#sheetDlg");
let SH = null;
function showSheet(i) {
  SH.i = (i + SH.list.length) % SH.list.length;
  $("#shImg").src = SH.list[SH.i];
  $("#shTitle").textContent = `${SH.title} · ${SH.list[SH.i].split("/").pop()} (${SH.i + 1}/${SH.list.length})`;
}
$("#shPrev").addEventListener("click", () => showSheet(SH.i - 1));
$("#shNext").addEventListener("click", () => showSheet(SH.i + 1));
$("#shClose").addEventListener("click", () => shDlg.close());
shDlg.addEventListener("keydown", ev => { if (ev.key === "ArrowRight") showSheet(SH.i + 1); if (ev.key === "ArrowLeft") showSheet(SH.i - 1); });

/* ---------- delegated clicks ---------- */
document.addEventListener("click", ev => {
  const c = ev.target.closest(".clip-media[data-a]"); if (c) { playClip(c); return; }
  const f = ev.target.closest("[data-full]"); if (f) { const [t, s] = f.dataset.full.split("|"); openPlayer(t, +s, 0); return; }
  const sh = ev.target.closest("[data-sheets]");
  if (sh) { const [t, s] = sh.dataset.sheets.split("|"); const e = BYTASK[t].episodes.find(x => x.seed === +s); SH = {list: e.diag.sheets, title: L().sheetTitle(short(t), s), i: 0}; showSheet(0); shDlg.showModal(); return; }
  const mo = ev.target.closest(".more"); if (mo) { const p = mo.previousElementSibling; const open = p.classList.toggle("clamp"); mo.textContent = open ? L().showAll : L().showLess; return; }
  const st = ev.target.closest("#filters [data-status]"); if (st) { FILTER.status = st.dataset.status; FILTER.mode = null; syncFilters(); renderEpisodes(app.dataset.view); return; }
  const md = ev.target.closest("#filters [data-mode]"); if (md) { FILTER.mode = FILTER.mode === md.dataset.mode ? null : md.dataset.mode; if (FILTER.mode) FILTER.status = "fail"; syncFilters(); renderEpisodes(app.dataset.view); return; }
  const go = ev.target.closest("[data-go]"); if (go) { location.hash = go.dataset.go; return; }
  const dtk = ev.target.closest("[data-dtask]");
  if (dtk) {
    DTASK = dtk.dataset.dtask;
    const t = DTD.tasks.find(x => x.task === DTASK);
    const keep = t.episodes.some(e => e.seed === DSEL.seed && e.points.some(p => p.t === DSEL.t)) && DTASK === DTD.tasks[0].task;
    if (!keep) { const e = t.episodes.find(x => x.points.some(p => p.g.some(c => c[0]) && p.g.some(c => !c[0]))) || t.episodes[0]; const p = e.points.find(q => q.g.some(c => c[0]) && q.g.some(c => !c[0])) || e.points[0]; DSEL = {seed: e.seed, t: p ? p.t : -1}; }
    document.querySelectorAll("[data-dtask]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.dtask === DTASK)));
    $("#dtAll").innerHTML = dataAll();
    return;
  }
  const dp = ev.target.closest("[data-dp]");
  if (dp) {
    const [s, t] = dp.dataset.dp.split("|"); DSEL = {seed: +s, t: +t};
    document.querySelectorAll("[data-dp]").forEach(b => b.setAttribute("aria-pressed", String(b === dp)));
    $("#dtDet").innerHTML = dataDetail();
    return;
  }
  const ct = ev.target.closest("[data-ctask]");
  if (ct) {
    CTASK = ct.dataset.ctask;
    document.querySelectorAll("[data-ctask]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ctask === CTASK)));
    $("#ubScenes").innerHTML = sceneList();
  }
});

/* ---------- tooltip ---------- */
const tip = $("#tip");
document.addEventListener("mousemove", ev => {
  const el = ev.target.closest("[data-tip]");
  if (!el) { tip.classList.remove("on"); return; }
  tip.textContent = el.dataset.tip; tip.classList.add("on");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${Math.min(window.innerWidth - w - 8, ev.clientX + 12)}px`;
  tip.style.top = `${Math.max(8, ev.clientY - h - 12)}px`;
});

setRate(RATE);
applyChrome();
route();
})();
</script>
</body>
</html>
